spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5434/myapp
    username: myapp_user
    password: myapp_pass
  jpa:
    hibernate:
      ddl-auto: update      # dev only; use Flyway/Liquibase later
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080